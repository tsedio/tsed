# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build & Release

on:
  push:
    branches: [production, alpha, beta, rc]
  pull_request:
    branches: [production, alpha, beta, rc]
    types: [opened, synchronize, closed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose missing npm packages must be published (e.g. v8.44.13)"
        required: true
        type: string
      monorepo-utils-version:
        description: "@tsed/monorepo-utils version used to publish (needs the resumable publication)"
        required: true
        default: "latest"
        type: string

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'
    strategy:
      matrix:
        node-version: [24.18.0]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable --network-timeout 500000
      - name: Run lint
        run: yarn test:lint

  test-core:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    strategy:
      matrix:
        node-version: [24.18.0]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable --network-timeout 500000
      - name: Run build
        run: yarn tsc --build
      - name: Run test
        run: yarn test:core --since origin/production
      - name: Upload vitest config files
        uses: actions/upload-artifact@v4
        with:
          name: vitest-config-core
          path: |
            team.json
            packages/{core,di,engines}/vitest.config.mts
            packages/platform/platform-http/vitest.config.mts
            packages/utils/normalize-path/vitest.config.mts
        continue-on-error: true

  test-specs:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    strategy:
      matrix:
        node-version: [24.18.0]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable --network-timeout 500000
      - name: Run build
        run: yarn tsc --build
      - name: Run test
        run: yarn test:specs --since origin/production
      - name: Upload vitest config files
        uses: actions/upload-artifact@v4
        with:
          name: vitest-config-specs
          path: |
            team.json
            packages/specs/*/vitest.config.mts
        continue-on-error: true
  test-platform:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    strategy:
      matrix:
        node-version: [24.18.0]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable --network-timeout 500000
      - name: Run build
        run: yarn tsc --build
      - name: Run test
        run: yarn test:platform --since origin/production
      - name: Upload vitest config files
        uses: actions/upload-artifact@v4
        with:
          name: vitest-config-platform
          path: |
            team.json
            packages/platform/platform-*/vitest.config.mts
  test-orm:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    strategy:
      matrix:
        node-version: [24.18.0]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable --network-timeout 500000
      - name: Run build
        run: yarn tsc --build
      - name: Run test
        run: yarn test:orm --since origin/production
      - name: Upload vitest config files
        uses: actions/upload-artifact@v4
        with:
          name: vitest-config
          path: |
            team.json
            packages/orm/*/vitest.config.mts
  test-graphql:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    strategy:
      matrix:
        node-version: [24.18.0]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable --network-timeout 500000
      - name: Run build
        run: yarn tsc --build
      - name: Run test
        run: yarn test:graphql --since origin/production
      - name: Upload vitest config files
        uses: actions/upload-artifact@v4
        with:
          name: vitest-config-graphql
          path: |
            team.json
            packages/graphql/*/vitest.config.mts
  test-security:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    strategy:
      matrix:
        node-version: [24.18.0]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable --network-timeout 500000
      - name: Run build
        run: yarn tsc --build
      - name: Run test
        run: yarn test:security --since origin/production
      - name: Upload vitest config files
        uses: actions/upload-artifact@v4
        with:
          name: vitest-config-security
          path: |
            team.json
            packages/security/*/vitest.config.mts
  test-third-parties:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch'

    strategy:
      matrix:
        node-version: [24.18.0]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --immutable --network-timeout 500000
      - name: Run build
        run: yarn tsc --build
      - name: Run test
        run: yarn test:third-parties --since origin/production
      - name: Upload vitest config files
        uses: actions/upload-artifact@v4
        with:
          name: vitest-config-third-parties
          path: |
            team.json
            packages/third-parties/*/vitest.config.mts

  test-download-artifacts:
    runs-on: ubuntu-latest
    needs: [lint, test-core, test-specs, test-platform, test-orm, test-security, test-graphql, test-third-parties]
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Download Core vitest config files
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: vitest-config-*
          merge-multiple: true
      - name: git status
        run: git status
      - name: ls
        run: ls -la

  deploy-packages:
    runs-on: ubuntu-latest
    needs: [lint, test-core, test-specs, test-platform, test-orm, test-security, test-graphql, test-third-parties]
    if: github.event_name == 'push' && contains('
      refs/heads/production
      refs/heads/alpha
      refs/heads/beta
      refs/heads/rc
      ', github.ref)
    permissions:
      contents: write
      id-token: write

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"
      - name: Install dependencies
        run: yarn install --network-timeout 500000

      #      - name: Download Core vitest config files
      #        uses: actions/download-artifact@v4
      #        with:
      #          pattern: vitest-config-*
      #          merge-multiple: true
      - name: "Git status"
        run: git status
      - name: Verify trusted publishing readiness
        run: yarn monorepo trust verify
      - name: Release packages
        env:
          CI: true
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn release
      - name: "Trigger Website workflow"
        run: |
          curl -X POST  https://api.github.com/repos/tsedio/tsed/actions/workflows/website.yml/dispatches \
          -H 'Accept: application/vnd.github.everest-preview+json' \
          -H 'Authorization: Bearer ${{secrets.GH_TOKEN}}' \
          --data '{"ref": "${{github.ref_name}}"}'

  # Manual replay of a release whose npm publication stopped half way.
  # Only the versions missing on npm are published: the others are skipped.
  republish-packages:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      MONOREPO_UTILS_VERSION: ${{ inputs.monorepo-utils-version }}
    steps:
      - name: Check the release tag
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: "yarn"
      - name: Check the tag version
        run: |
          VERSION=$(node -p 'require("./package.json").version')
          if [ "v$VERSION" != "$RELEASE_TAG" ]; then
            echo "::error::package.json version $VERSION does not match $RELEASE_TAG"
            exit 1
          fi
      - name: Install dependencies
        run: yarn install --network-timeout 500000
      - name: Use a resumable @tsed/monorepo-utils
        # The tag's .yarnrc.yml age gate only preapproves the version it was released with.
        run: |
          YARN_ENABLE_IMMUTABLE_INSTALLS=false yarn up --no-time-gate "@tsed/monorepo-utils@$MONOREPO_UTILS_VERSION"
          node -e '
            const installed = require("./node_modules/@tsed/monorepo-utils/package.json").version;
            const [major, minor, patch] = installed.split(/[.-]/).map(Number);
            if (major < 3 || (major === 3 && (minor < 3 || (minor === 3 && patch < 4)))) {
              console.error(`::error::@tsed/monorepo-utils ${installed} cannot resume a publication (needs >= 3.3.4)`);
              process.exit(1);
            }
            console.log(`Using @tsed/monorepo-utils ${installed}`);
          '
      - name: Build packages
        run: yarn build
      - name: Verify trusted publishing readiness
        run: yarn monorepo trust verify
      - name: Publish missing packages
        run: node --input-type=module -e 'import {MonoRepo} from "@tsed/monorepo-utils"; await new MonoRepo().publish("packages");'
